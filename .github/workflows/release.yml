name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Entry in gnomerock/Gnomod's repo.json that this workflow updates.
  PLUGIN: Konyakku

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/dalamud
    steps:
      - name: Check Gnomod token
        env:
          GNOMOD_TOKEN: ${{ secrets.GNOMOD_TOKEN }}
        run: |
          if [ -z "$GNOMOD_TOKEN" ]; then
            echo "::error::GNOMOD_TOKEN secret is missing. Add a token that can write to gnomerock/Gnomod."
            exit 1
          fi

      # Build exactly the tagged commit, not whatever is on main.
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p "$DALAMUD_HOME"
          curl -fsSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o dalamud.zip
          unzip -q dalamud.zip -d "$DALAMUD_HOME"

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet build "$PLUGIN/$PLUGIN.csproj" -c Release -p:Version="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="$PLUGIN/bin/Release/$PLUGIN/latest.zip"
          # Re-runs (e.g. after fixing GNOMOD_TOKEN) replace the zip instead of failing on the existing release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Konnyaku Jelly $VERSION" --generate-notes
          fi

      - uses: actions/checkout@v5
        with:
          repository: gnomerock/Gnomod
          token: ${{ secrets.GNOMOD_TOKEN }}
          path: gnomod

      - name: Update Gnomod repo.json
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/latest.zip"
          API=$(jq '.DalamudApiLevel' "$PLUGIN/bin/Release/$PLUGIN/$PLUGIN.json")
          cd gnomod
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry so a release of another plugin pushing at the same time doesn't fail this one.
          for attempt in 1 2 3; do
            git pull -q --rebase origin main
            jq -e --arg name "$PLUGIN" 'any(.[]; .InternalName == $name)' repo.json > /dev/null \
              || { echo "::error::No $PLUGIN entry in Gnomod repo.json"; exit 1; }
            jq --arg name "$PLUGIN" --arg v "$VERSION" --arg url "$URL" --argjson api "$API" \
              'map(if .InternalName == $name then
                     .AssemblyVersion = $v | .DalamudApiLevel = $api
                     | .DownloadLinkInstall = $url | .DownloadLinkUpdate = $url | .DownloadLinkTesting = $url
                     | .LastUpdate = (now | floor)
                   else . end)' repo.json > repo.tmp && mv repo.tmp repo.json
            git commit -qam "Update $PLUGIN to $VERSION" || { echo "Nothing to update"; exit 0; }
            git push -q origin main && exit 0
            git reset -q --hard origin/main
          done
          echo "::error::Could not push to Gnomod after 3 attempts"
          exit 1
